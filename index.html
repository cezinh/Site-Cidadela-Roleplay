<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{SEO_TITLE}}</title>
    <meta name="description" content="{{SEO_DESCRIPTION}}" />
    <meta name="keywords" content="{{SEO_KEYWORDS}}" />
    <meta name="theme-color" content="{{THEME_COLOR}}" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="{{SITE_URL}}/" />

    <!-- Open Graph / redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="{{SITE_NAME}}" />
    <meta property="og:title" content="{{SEO_TITLE}}" />
    <meta property="og:description" content="{{SEO_DESCRIPTION}}" />
    <meta property="og:url" content="{{SITE_URL}}/" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo da Cidadela Roleplay sobre arte grafitada rosa e preta" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SEO_TITLE}}" />
    <meta name="twitter:description" content="{{SEO_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

    <!-- Ícones -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Imagens do Hero carregam antes de tudo -->
    <link rel="preload" as="image" type="image/webp" href="/images/logo-cidadela-640.webp" fetchpriority="high" />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/images/personagem-640.avif 640w, /images/personagem-1000.avif 1000w, /images/personagem-1400.avif 1400w"
      imagesizes="(min-width: 1024px) 44vw, 92vw"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "{{SITE_NAME}}",
        "url": "{{SITE_URL}}/",
        "logo": "{{SITE_URL}}/icon-512.png",
        "description": "{{SEO_DESCRIPTION}}"
      }
    </script>

    <style>
      /* Tela de carregamento: aparece antes do JS e some assim que o Hero estiver pronto. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #020203;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
      }
      #boot.is-done {
        opacity: 0;
        visibility: hidden;
      }
      #boot .boot-inner {
        display: grid;
        justify-items: center;
        gap: 28px;
      }
      #boot img {
        width: min(220px, 52vw);
        height: auto;
        animation: boot-breathe 1.6s ease-in-out infinite;
      }
      #boot .boot-bar {
        position: relative;
        width: 140px;
        height: 2px;
        overflow: hidden;
        background: rgba(254, 254, 255, 0.08);
      }
      #boot .boot-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: #f22283;
        box-shadow: 0 0 12px #f22283;
        animation: boot-run 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-run {
        from { transform: translateX(-110%); }
        to { transform: translateX(260%); }
      }
      @keyframes boot-breathe {
        50% { opacity: 0.72; transform: scale(0.985); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img, #boot .boot-bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-inner">
        <img src="/images/logo-marca-480.webp" alt="" width="480" height="303" />
        <div class="boot-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <p style="color:#fefeff;font-family:sans-serif;padding:24px">
        Cidadela Roleplay — servidor de GTA RP no FiveM. Ative o JavaScript para ver o site completo.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
